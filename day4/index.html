
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Notes Toolkit</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Notes Toolkit</h1>

    <div class="toolbar">
      <button id="theme-toggle" type="button">Dark mode</button>
    </div>

    <label for="note-text">Write your note</label>
    <textarea
      id="note-text"
      rows="10"
      maxlength="1000"
      placeholder="Start writing your note..."
    ></textarea>

    <div class="counters">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <button id="clear-btn" type="button">Clear note</button>
  </main>
</body>
</html>
