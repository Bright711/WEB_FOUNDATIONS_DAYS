<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
  <main>
    <h1>Users Directory</h1>

    <button id="load-users" type="button">Load Users</button>

    <div>
      <label for="filter-input">Filter users by name:</label>
      <input
        type="text"
        id="filter-input"
        placeholder="Type a name to search..."
      >
    </div>

    <p id="status" role="status" aria-live="polite">
      Click "Load Users" to get started.
    </p>

    <ul id="users-list"></ul>
  </main>
</body>
</html>
